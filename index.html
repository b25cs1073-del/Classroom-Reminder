<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Deadline & Proximity Reminder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="background-grid"></div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="header-glass">
            <h1 class="logo">Deadlines & Academic Hub</h1>
            <button id="login-btn" class="btn-primary">Google Login</button>
        </header>

        <!-- Main Dashboard -->
        <main class="dashboard">
            <section class="hero-section">
                <h2>Never Miss A <span class="highlight">Deadline</span> Again</h2>
                <p>Automatic smart proximity reminders & deadline tracker</p>
            </section>

            <!-- Google Classroom Deadlines Section -->
            <h3 class="section-title">📌 Google Classroom Upcoming Deadlines</h3>
            <div id="deadlines-container" class="cards-grid">
                <p style="color: #aaa; text-align: center; grid-column: 1/-1;">
                    Please click "Google Login" button above to fetch upcoming assignments.
                </p>
            </div>
        </main>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Failed!', err));
            });
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
